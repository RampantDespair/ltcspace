# Microcache zone for the mwebexplorer /api/v1/mweb/* surface.
# Kept separate from http-proxy-cache.conf so the mweb working set has
# its own LRU and doesn't compete with the mempool/esplora API caches.
# inactive=30d lets a popular-but-bursty finalized response (the daemon
# emits Cache-Control: immutable for confirmed blocks/kernels/outputs/
# pegs at depth >= FinalityDepth) survive a quiet stretch instead of
# being evicted on idle timeout.
proxy_cache_path /var/cache/nginx/mwx keys_zone=mwx:200m levels=1:2 inactive=30d max_size=2g use_temp_path=off;
