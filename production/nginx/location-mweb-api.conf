################
# mweb routing #
################
#
# Public mweb API at /api/v1/mweb/* served direct from the
# mwebexplorer daemon on 127.0.0.1:8080 (bypassing the mempool
# Express backend). The daemon's routes are NOT prefixed with /mweb
# — it serves /api/v1/blocks/tip, /api/v1/stream, etc. — so each
# location below rewrites /api/v1/mweb/<rest> -> /api/v1/<rest>
# before proxy_pass.
#
# Depends on:
#   upstream mwebexplorer-mainnet  (upstream-mwebexplorer.conf)
#   proxy_cache_path mwx           (http-proxy-cache-mwx.conf)
#
# Daemon must run with api.trust_forwarded_for=true so its per-IP
# rate limiter reads the X-Forwarded-For chain this nginx forwards
# (whose leftmost entry is the real client IP after ltcspace's edge
# real_ip module has processed the inbound CDN chain).

# Block internal/admin paths.
location /api/v1/mweb/internal/ {
	return 404;
}

# WebSocket stream: bypass cache, upgrade headers, long read timeout.
location = /api/v1/mweb/stream {
	rewrite ^/api/v1/mweb/(.*)$ /api/v1/$1 break;
	proxy_pass http://mwebexplorer-mainnet;

	proxy_http_version 1.1;
	proxy_set_header Host              $host;
	proxy_set_header X-Real-IP         $remote_addr;
	proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Upgrade           $http_upgrade;
	proxy_set_header Connection        "upgrade";

	proxy_read_timeout 1h;
	proxy_buffering    off;
	proxy_cache        off;
}

# /api/v1/mweb/* — microcache + thundering-herd lock, honoring the
# daemon's finality-aware Cache-Control (max-age=5,SWR=15 for tip
# reads; max-age=1y, immutable for finalized detail responses).
location /api/v1/mweb/ {
	rewrite ^/api/v1/mweb/(.*)$ /api/v1/$1 break;
	proxy_pass http://mwebexplorer-mainnet;

	proxy_http_version 1.1;
	proxy_set_header Host              $host;
	proxy_set_header X-Real-IP         $remote_addr;
	# $proxy_add_x_forwarded_for (NOT $remote_addr) — ltcspace's edge
	# has already real_ip-rewritten $remote_addr to the actual client
	# IP from the inbound CDN chain, so this header forwards a
	# validated chain whose leftmost entry is the real client IP.
	proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Request-ID      $request_id;
	proxy_set_header Connection        "";

	proxy_connect_timeout 5s;
	proxy_send_timeout    30s;
	proxy_read_timeout    30s;

	proxy_cache     mwx;
	proxy_cache_key "$scheme:$host:$request_method:$request_uri";

	# lock_age, lock_timeout, and proxy_read_timeout all 30s — these
	# must move together. lock_age caps how long the lock holder owns
	# the upstream slot; lock_timeout caps how long a waiter waits
	# before fanning out to origin.
	proxy_cache_lock         on;
	proxy_cache_lock_age     30s;
	proxy_cache_lock_timeout 30s;

	proxy_cache_use_stale         error timeout updating http_500 http_502 http_503 http_504;
	proxy_cache_background_update on;

	# Defensive floors only — upstream always emits Cache-Control.
	proxy_cache_valid 200       5s;
	proxy_cache_valid 301 302   30s;
	proxy_cache_valid 404       30s;
	proxy_cache_valid 500 502 503 504 1s;

	proxy_hide_header Set-Cookie;
	proxy_ignore_headers Set-Cookie;

	# X-Cache-Status surfaces hit/miss state. Defining add_header
	# here also opts this location OUT of server-common.conf's
	# server-level `add_header Cache-Control "public"` inheritance
	# (nginx replaces inherited add_header directives whenever the
	# current scope defines any) — so the daemon's upstream
	# Cache-Control header reaches the client unmodified. Removing
	# this add_header without a replacement strategy would cause
	# CC-header duplication.
	add_header X-Cache-Status $upstream_cache_status always;
}
